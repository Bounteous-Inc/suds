version: 2

# CI installs from the committed composer.lock, so it does not notice new
# upstream releases on its own. Dependabot is what surfaces them: one PR per
# update, each carrying a reviewable lock diff and running the full CI matrix.
# That isolates a breaking release to a single PR instead of turning an
# unrelated contributor's build red.
#
# The floors of the `^` constraints are checked separately, by the `lowest`
# entry in ci.yml's matrix — Dependabot only ever moves versions up.
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Dev tooling moves often and is rarely interesting individually; one PR
      # per week for the lot keeps the queue readable. drush/drush — our only
      # runtime dependency — stays ungrouped so a breaking release is
      # attributable to a single package.
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
