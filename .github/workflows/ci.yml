name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, pdo_sqlite, gd, zip
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php-version }}-

      # Installs from the committed composer.lock, so every run on a given
      # commit resolves identically. New upstream releases arrive as Dependabot
      # PRs instead (see .github/dependabot.yml), where each one is isolated
      # and reviewable.
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Single source of truth: `composer check` runs `grumphp run`, the same
      # task set as the pre-commit hook (Drupal phpcs + static analysis + unit
      # tests). Adding a grumphp task makes it run locally, on commit, AND here.
      - name: Quality (grumphp)
        run: composer check

      - name: Integration tests
        run: composer test:integration

      - name: Provision SUT
        run: composer sut:si

      - name: Functional tests
        run: composer test:functional
