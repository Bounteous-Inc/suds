grumphp:
  tasks:
    # Validate composer.json is well-formed and in sync.
    composer:
      file: composer.json

    # Enforce normalized composer.json formatting.
    composer_normalize: ~

    # Lint JSON files.
    jsonlint:
      detect_key_conflicts: true

    # Lint PHP syntax quickly before the heavier PHPCS/PHPStan passes.
    phplint:
      triggered_by: [php]

    # Enforce Drupal coding standards.
    phpcs:
      standard: phpcs.xml.dist
      show_sniffs_error_path: true

    # Run static analysis.
    phpstan:
      configuration: phpstan.neon
      use_grumphp_paths: false
      memory_limit: "-1"

    # Run the unit test suite only. Functional tests require the SUT to be
    # provisioned first (`composer sut:si`) and are run separately.
    phpunit:
      config_file: phpunit.xml.dist
      testsuite: unit

    # Enforce Conventional Commits on the subject line.
    # Format: <type>[optional scope][!]: <description>
    #
    # type_scope_conventions cannot express the `!` breaking-change marker, so
    # the convention is enforced as an explicit matcher instead. git-cliff reads
    # `!` the same as a `BREAKING CHANGE:` footer; cliff.toml's
    # breaking_always_bump_major relies on this. multiline: false anchors the
    # matcher to the subject line (the first line).
    git_commit_message:
      enforce_capitalized_subject: false
      enforce_single_lined_subject: true
      max_subject_width: 100
      max_body_width: 0
      multiline: false
      matchers:
        Conventional Commit: '/^(?:(?:fixup|squash|amend)! )?(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(?:\([^)]+\))?!?: \S/'

    # Detect debug artifacts left in committed code.
    git_blacklist:
      keywords:
        - '\bvar_dump\('
        - '\bdd\('
        - '(?<!::)\bdump\('
        - '\bxdebug_break\('
        - '\bconsole\.log\('
      regexp_type: P
      triggered_by: [php]

    # Lint YAML files.
    yamllint:
      whitelist_patterns:
        - /^.*\.(yml|yaml)$/i
      object_support: true
