grumphp:
  tasks:
    # Validate composer.json is well-formed and dependencies are in sync.
    composer:
      file: composer.json
      no_check_lock: false
      no_check_publish: false

    # Enforce normalized composer.json formatting.
    composer_normalize: ~

    # Lint JSON files.
    jsonlint:
      detect_key_conflicts: true

    # Enforce Drupal coding standards.
    phpcs:
      standard: phpcs.xml.dist
      show_sniffs_error_path: true

    # Run static analysis.
    phpstan:
      configuration: phpstan.neon
      use_grumphp_paths: false
      memory_limit: "-1"

    # Lint YAML files in custom code and exported configuration.
    yamllint:
      whitelist_patterns:
        - /^config\//
        - /^{{ drupal_root }}\/modules\/custom\//
        - /^{{ drupal_root }}\/themes\/custom\//
      object_support: true

    # Block debug artifacts from being committed.
    git_blacklist:
      keywords:
        - '\bvar_dump\('
        - '\bdd\('
        - '(?<!::)\bdump\('
        - '\bxdebug_break\('
        - '\bconsole\.log\('
      regexp_type: P
      triggered_by:
        - php
        - module
        - theme
        - inc
        - install
        - profile
        - js

    # Check for Twig coding standard violations in custom themes.
    # Adjust the path if your theme lives elsewhere, or remove this task
    # entirely if the project has no custom theme.
    twigcsfixer:
      paths:
        - '{{ drupal_root }}/themes/custom'
      level: warning

    # Enforce Conventional Commits on the subject line.
    # Format: <type>[optional scope][!]: <description>
    #
    # type_scope_conventions cannot express the `!` breaking-change marker, so
    # the convention is enforced as an explicit matcher instead.
    # multiline: false anchors the matcher to the subject line (the first line).
    git_commit_message:
      enforce_capitalized_subject: false
      enforce_single_lined_subject: true
      max_subject_width: 100
      max_body_width: 0
      multiline: false
      matchers:
        Conventional Commit: '/^(?:(?:fixup|squash|amend)! )?(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(?:\([^)]+\))?!?: \S/'
