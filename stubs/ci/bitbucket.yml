# bitbucket-pipelines.yml
# Generated by `drush suds:scaffold:ci bitbucket`. Review and customize.
# See https://support.atlassian.com/bitbucket-cloud/docs/configure-your-pipeline/

image: php:{{ php_version }}-cli

definitions:
  caches:
    composer: ~/.composer/cache

  steps:
    - step: &quality
        name: Code Quality
        caches:
          - composer
        script:
          - apt-get update -qq && apt-get install -y -qq git unzip
          - >
            curl -sS https://getcomposer.org/installer
            | php -- --install-dir=/usr/local/bin --filename=composer
          - >
            composer install --no-progress --prefer-dist
            --optimize-autoloader
          - vendor/bin/grumphp run --no-interaction
          # grumphp.yml defines which tasks run (phpcs, phpstan, yamllint, etc.).
          # If phpunit is configured and requires a database, add a services
          # block to this step:
          # https://support.atlassian.com/bitbucket-cloud/docs/use-services-and-databases-in-bitbucket-pipelines/

    # Uncomment and configure to enable automated artifact deployment.
    # Requires deploy.repo.url to be set in suds.yml.
    #
    # - step: &deploy
    #     name: Deploy Artifact
    #     script:
    #       - apt-get update -qq && apt-get install -y -qq git unzip
    #       - >
    #         curl -sS https://getcomposer.org/installer
    #         | php -- --install-dir=/usr/local/bin --filename=composer
    #       - composer install --no-progress --prefer-dist
    #       - vendor/bin/drush suds:deploy
    #       # Run update steps on the target environment after deploying.
    #       # Replace @your-alias with the Drush alias for the target environment.
    #       # - vendor/bin/drush suds:update @your-alias

pipelines:
  default:
    - step: *quality

  # branches:
  #   main:
  #     - step: *quality
  #     - step: *deploy
