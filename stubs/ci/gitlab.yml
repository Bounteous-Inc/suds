# .gitlab-ci.yml
# Generated by `drush suds:scaffold:ci gitlab`. Review and customize.
# See https://docs.gitlab.com/ee/ci/ for documentation.

image: php:{{ php_version }}-cli

stages:
  - quality
  # - deploy

cache:
  paths:
    - vendor/

before_script:
  - apt-get update -qq && apt-get install -y -qq git unzip
  - >
    curl -sS https://getcomposer.org/installer
    | php -- --install-dir=/usr/local/bin --filename=composer
  - composer install --no-progress --prefer-dist --optimize-autoloader

quality:
  stage: quality
  script:
    - vendor/bin/grumphp run --no-interaction
  # grumphp.yml defines which tasks run (phpcs, phpstan, yamllint, etc.).
  # If phpunit is configured and requires a database, add a services block:
  # https://docs.gitlab.com/ee/ci/services/

