# .github/workflows/ci.yml
# Generated by `drush suds:scaffold:ci github`. Review and customize.
# See https://docs.github.com/en/actions for documentation.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '{{ php_version }}'
          coverage: none

      - name: Install Composer dependencies
        run: >
          composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Run quality checks
        run: vendor/bin/grumphp run --no-interaction
        # grumphp.yml defines which tasks run (phpcs, phpstan, yamllint, etc.).
        # If phpunit is configured and requires a database, add a services
        # block to this job:
        # https://docs.github.com/en/actions/use-cases-and-examples/using-containerized-services

